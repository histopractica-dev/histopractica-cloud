car:["Condrocito","Condroblasto","Célula condrogénica","Fibroblasto"],oseo:["Osteocito","Osteoblasto","Osteoclasto","Célula osteoprogenitora"],mus:["Fibra muscular esquelética","Cardiomiocito","Célula muscular lisa"],
ner:["Neurona","Astrocito","Oligodendrocito","Microglía","Célula ependimaria"],epi:["Célula epitelial","Célula caliciforme","Célula basal","Célula ciliada","Célula en paraguas (urotelio)","Célula endotelial"]};

const REL={san:["con"],con:["san","adi"],adi:["con"],car:["oseo","con"],oseo:["car","con"],mus:["con"],ner:["epi"],epi:["con"]};

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],app=$("#app");
let BANK=[],S=null,CFG=null,SEL=null,SR=[],DR=null,SMSG="",OFF=0,LQ="";

const kv=(m,k,v)=>new Promise((res,rej)=>{const t=DB.transaction("kv",m==="r"?"readonly":"readwrite"),st=t.objectStore("kv"),q=m==="r"?st.get(k):st.put(v,k);t.oncomplete=()=>res(q.result);t.onerror=t.onabort=()=>rej(t.error)});
async function initDB(){try{DB=await idb();let b=await kv("r","bank");if(!b){b=[];try{b=JSON.parse(localStorage.getItem("hp_bank")||"[]")}catch(e){}if(b.length){await kv("w","bank",b);try{localStorage.removeItem("hp_bank")}catch(e){}}}LOCAL=b;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}catch(e){DB=null;try{LOCAL=JSON.parse(localStorage.getItem("hp_bank")||"[]")}catch(x){}}}

 if(CURRENT_USER){BANK=[...new Map(REMOTE_BANK.filter(validE).map(e=>[e.id,{...e,subtipo:e.subtipo==="Epitelio simple plano (endotelio)"?"Epitelio simple plano":e.subtipo}])).values()];return}

async function refreshRemoteBank(){
 const {data:sessionData,error:sessionError}=await SUPA.auth.getSession();
 if(sessionError)throw sessionError;
 const token=sessionData.session?.access_token;
 if(!token)throw new Error("Inicia sesión para consultar el banco.");
 const response=await fetch("/api/bank",{headers:{Authorization:`Bearer ${token}`},cache:"no-store"});
 const payload=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(payload.error||"No se pudo cargar el banco.");
 REMOTE_BANK=await Promise.all((payload.questions||[]).map(async row=>({
  id:row.id,tema:row.theme,
  // The student catalog deliberately omits answer labels. They are requested one question at a time from the server.
  subtipo:isAdmin()?(row.subtype||undefined):(row.has_subtype?"Tipo de tejido":undefined),
  url:await imageUrlForRow(row),_image_path:row.image_path||null,

async function storeQuestionOnSupabase(e){
 if(!isAdmin())throw new Error("Solo el administrador puede modificar el banco.");
 let imagePath=e._image_path||null,externalUrl=null;
 if(String(e.url||"").startsWith("data:image/")){
   const response=await fetch(e.url);const blob=await response.blob();const ext=blob.type.split("/")[1]?.replace("jpeg","jpg")||"jpg";imagePath=`${String(e.id).replace(/[^a-zA-Z0-9_-]/g,"_")}.${ext}`;

  $("#admin-users-count").textContent=String(userResult.count??users.length);$("#admin-exams-count").textContent=String(examCount.count??0);
  $("#admin-correct-count").textContent=String(attempts.reduce((sum,a)=>sum+a.correct_answers,0));$("#admin-wrong-count").textContent=String(attempts.reduce((sum,a)=>sum+a.incorrect_answers,0));
  $("#admin-users").innerHTML=users.length?`<table class="admin-table"><thead><tr><th>Correo</th><th>Nombre</th><th>Rol</th><th>Registro</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.email||"—")}</td><td>${esc(u.display_name||"—")}</td><td>${esc(u.role)}</td><td>${esc(u.created_at?new Date(u.created_at).toLocaleString("es-MX"):"—")}</td></tr>`).join("")}</tbody></table>`:"No hay usuarios registrados.";
  $("#admin-exams").innerHTML=attempts.length?`<table class="admin-table"><thead><tr><th>Estudiante</th><th>Examen</th><th>Aciertos</th><th>Errores</th><th>Nota</th><th>Fecha</th><th>Correo</th></tr></thead><tbody>${attempts.map(a=>`<tr><td>${esc(userMap.get(a.user_id)?.email||a.user_id)}</td><td>${esc(a.exam_title)}</td><td>${a.correct_answers}/${a.total_questions}</td><td>${a.incorrect_answers}${a.unanswered?` + ${a.unanswered} omitidas`:""}</td><td>${a.score}%</td><td>${esc(new Date(a.completed_at).toLocaleString("es-MX"))}</td><td>${esc(a.notification_status)}</td></tr>`).join("")}</tbody></table><p class="mu">Se muestran los últimos ${attempts.length} exámenes (máximo 300 en esta vista).</p>`:"Todavía no hay exámenes completados.";
 }catch(error){console.error("admin dashboard error",error);const box=$("#admin-users");if(box)box.textContent="No se pudieron cargar los datos: "+(error.message||"error de conexión")}
}

initDB().then(()=>bootAuth()).catch(error=>{console.error(error);authView("login","No se pudo iniciar la aplicación. Revisa la configuración y la conexión.")}).finally(()=>app.removeAttribute("aria-busy"));
</script></body></html>
